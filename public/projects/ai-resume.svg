<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d19" />
      <stop offset="50%" stop-color="#0f182c" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="teal-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#ar-bg)" />

  <pattern id="ar-grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
  </pattern>
  <rect width="1200" height="700" fill="url(#ar-grid)" />

  <!-- App Window Container -->
  <rect x="60" y="50" width="1080" height="600" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="50" width="1080" height="50" rx="16" fill="#090d16" stroke="#334155" stroke-width="1" />
  <circle cx="95" cy="75" r="6" fill="#ef4444" />
  <circle cx="115" cy="75" r="6" fill="#f59e0b" />
  <circle cx="135" cy="75" r="6" fill="#10b981" />
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">AI-Powered Resume Analyzer — NLTK Text Processing &amp; Skill Extraction</text>

  <!-- Left: Resume Text Ingestion & Parsing -->
  <rect x="90" y="125" width="480" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />
  <text x="115" y="160" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Resume Ingestion &amp; Parsing</text>
  <text x="115" y="180" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">nlp_utils.py • NLTK Tokenization • Keyword Matcher</text>

  <!-- Resume Document Preview Card -->
  <rect x="115" y="200" width="430" height="150" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="135" y="230" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600"># Input Resume Text Segment</text>
  <text x="135" y="255" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">"AI engineer proficient in Python, PyTorch, FastAPI, machine learning algorithms, and full-stack web applications with Docker containerization..."</text>
  <text x="135" y="300" fill="#a78bfa" font-family="monospace" font-size="11">✓ nlp_utils.extract_skills(text)</text>
  <text x="135" y="325" fill="#34d399" font-family="monospace" font-size="11">✓ nlp_utils.clean_stopwords(tokens)</text>

  <!-- Extracted Skill Tokens -->
  <rect x="115" y="365" width="430" height="115" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="135" y="392" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">EXTRACTED KEYWORD TOKENS (NLTK)</text>
  
  <rect x="135" y="405" width="70" height="26" rx="4" fill="#0284c7" />
  <text x="170" y="422" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Python</text>

  <rect x="215" y="405" width="75" height="26" rx="4" fill="#0284c7" />
  <text x="252" y="422" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">PyTorch</text>

  <rect x="300" y="405" width="75" height="26" rx="4" fill="#0284c7" />
  <text x="337" y="422" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">FastAPI</text>

  <rect x="385" y="405" width="140" height="26" rx="4" fill="#059669" />
  <text x="455" y="422" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Machine Learning</text>

  <rect x="135" y="440" width="70" height="26" rx="4" fill="#7c3aed" />
  <text x="170" y="457" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Docker</text>

  <rect x="215" y="440" width="90" height="26" rx="4" fill="#7c3aed" />
  <text x="260" y="457" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">Full-Stack</text>

  <rect x="315" y="440" width="110" height="26" rx="4" fill="#7c3aed" />
  <text x="370" y="457" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11">NLTK Parser</text>

  <!-- Button -->
  <rect x="115" y="495" width="430" height="42" rx="8" fill="url(#teal-indigo)" />
  <text x="330" y="521" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Analyze Resume NLP Profile →</text>

  <!-- Right: Analysis Dashboard & Repository Spec -->
  <rect x="590" y="125" width="520" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />

  <!-- Score Card -->
  <rect x="615" y="150" width="470" height="105" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="635" y="180" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PARSED CANDIDATE DOMAIN ALIGNMENT</text>
  <text x="635" y="215" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">AI/ML &amp; Full-Stack Profile</text>
  <text x="635" y="238" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">High density of verified technical skill keywords extracted</text>

  <!-- Pipeline Details -->
  <rect x="615" y="270" width="470" height="145" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="635" y="298" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">NLP Architecture &amp; Capabilities</text>
  
  <text x="635" y="326" fill="#38bdf8" font-family="monospace" font-size="12">1. Tokenization: setup_nltk.py (Punkt &amp; Stopwords)</text>
  <text x="635" y="350" fill="#cbd5e1" font-family="monospace" font-size="12">2. Processing: nlp_utils.py (Linguistic Normalization)</text>
  <text x="635" y="374" fill="#cbd5e1" font-family="monospace" font-size="12">3. Server Core: app.py Web Application Controller</text>
  <text x="635" y="398" fill="#34d399" font-family="monospace" font-size="12">4. Templates: Responsive presentation UI</text>

  <!-- Code Structure Box -->
  <rect x="615" y="430" width="470" height="165" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="635" y="458" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600">REPOSITORY REPO STRUCTURE</text>
  <text x="635" y="482" fill="#e2e8f0" font-family="monospace" font-size="11">app.py ────────► Web server application &amp; routes</text>
  <text x="635" y="502" fill="#e2e8f0" font-family="monospace" font-size="11">nlp_utils.py ──► Text processing &amp; token extraction</text>
  <text x="635" y="522" fill="#e2e8f0" font-family="monospace" font-size="11">setup_nltk.py ─► NLTK resource downloader</text>
  <text x="635" y="542" fill="#38bdf8" font-family="monospace" font-size="11">templates/ ────► Jinja2 HTML templates</text>
  <text x="635" y="562" fill="#94a3b8" font-family="monospace" font-size="11">build.sh ──────► Deployment build script</text>
</svg>

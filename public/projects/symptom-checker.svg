<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)" />

  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
  </pattern>
  <rect width="1200" height="700" fill="url(#grid)" />

  <!-- App Window Container -->
  <rect x="60" y="50" width="1080" height="600" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="50" width="1080" height="50" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="95" cy="75" r="6" fill="#ef4444" />
  <circle cx="115" cy="75" r="6" fill="#f59e0b" />
  <circle cx="135" cy="75" r="6" fill="#10b981" />
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">AI Symptom Checker — Diagnosis & Precaution Engine</text>

  <!-- Sidebar -->
  <rect x="90" y="125" width="280" height="495" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="115" y="160" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Select Symptoms</text>
  <text x="115" y="180" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Multi-select matching symptoms</text>

  <!-- Symptom Pills -->
  <rect x="115" y="205" width="110" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
  <text x="170" y="226" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">✓ High Fever</text>

  <rect x="235" y="205" width="115" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
  <text x="292" y="226" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">✓ Headache</text>

  <rect x="115" y="248" width="105" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
  <text x="167" y="269" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">✓ Fatigue</text>

  <rect x="230" y="248" width="120" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="290" y="269" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">+ Chills</text>

  <rect x="115" y="291" width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="172" y="312" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">+ Joint Pain</text>

  <rect x="240" y="291" width="110" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="295" y="312" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">+ Nausea</text>

  <!-- Button -->
  <rect x="115" y="355" width="230" height="42" rx="8" fill="url(#teal-accent)" />
  <text x="230" y="381" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Run ML Diagnosis →</text>

  <!-- Model Info Box -->
  <rect x="115" y="425" width="230" height="165" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="130" y="452" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">MODEL PIPELINE</text>
  <text x="130" y="477" fill="#38bdf8" font-family="monospace" font-size="11">FastAPI Backend</text>
  <text x="130" y="497" fill="#a78bfa" font-family="monospace" font-size="11">Random Forest Classifier</text>
  <text x="130" y="517" fill="#4ade80" font-family="monospace" font-size="11">Multi-class Disease Map</text>
  <text x="130" y="537" fill="#cbd5e1" font-family="monospace" font-size="11">Scikit-learn • Pandas</text>
  <text x="130" y="562" fill="#10b981" font-family="monospace" font-size="11">● Inference: ~12ms</text>

  <!-- Main Output Section -->
  <rect x="395" y="125" width="715" height="495" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  
  <!-- Predicted Condition Banner -->
  <rect x="425" y="155" width="655" height="100" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="450" y="190" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PREDICTED CONDITION</text>
  <text x="450" y="222" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">Viral Influenza (Flu)</text>
  <rect x="940" y="180" width="115" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="997" y="200" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">High Match</text>

  <!-- Description Card -->
  <rect x="425" y="275" width="655" height="130" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <text x="450" y="305" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Condition Description</text>
  <text x="450" y="335" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Viral infection that attacks your respiratory system, nose, throat and lungs.</text>
  <text x="450" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Common symptoms include high fever, body aches, fatigue, and severe headache.</text>
  <text x="450" y="385" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Disclaimer: Preliminary automated classification only. Not a medical substitute.</text>

  <!-- Precautions Grid -->
  <text x="425" y="440" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Recommended Precautions &amp; Actions</text>

  <rect x="425" y="460" width="315" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="445" y="488" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">1. Adequate Hydration &amp; Rest</text>
  <text x="445" y="508" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Drink warm fluids, electrolytes, and rest.</text>

  <rect x="765" y="460" width="315" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="785" y="488" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">2. Isolate &amp; Monitor Temperature</text>
  <text x="785" y="508" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Avoid spreading infection; track fever logs.</text>

  <rect x="425" y="540" width="315" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="445" y="568" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">3. Over-the-counter Relief</text>
  <text x="445" y="588" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Use physician-approved fever reducers.</text>

  <rect x="765" y="540" width="315" height="65" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="785" y="568" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">4. Consult Doctor If Symptoms Persist</text>
  <text x="785" y="588" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Seek urgent care if breathing becomes difficult.</text>
</svg>

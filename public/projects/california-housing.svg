<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amber-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#ch-bg)" />

  <pattern id="ch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
  </pattern>
  <rect width="1200" height="700" fill="url(#ch-grid)" />

  <!-- App Window Container -->
  <rect x="60" y="50" width="1080" height="600" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="60" y="50" width="1080" height="50" rx="16" fill="#090d16" stroke="#334155" stroke-width="1" />
  <circle cx="95" cy="75" r="6" fill="#ef4444" />
  <circle cx="115" cy="75" r="6" fill="#f59e0b" />
  <circle cx="135" cy="75" r="6" fill="#10b981" />
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">California House Price Prediction API — FastAPI &amp; Random Forest Regressor</text>

  <!-- Left: House Features Input & Endpoints -->
  <rect x="90" y="125" width="480" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />
  <text x="115" y="160" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Housing Feature Inputs (POST /predict)</text>
  <text x="115" y="180" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Pydantic Schema Validation</text>

  <!-- Feature Grid -->
  <rect x="115" y="200" width="205" height="52" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="130" y="222" fill="#94a3b8" font-family="monospace" font-size="11">MedInc (Median Income)</text>
  <text x="130" y="240" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">8.3252 ($83.2k)</text>

  <rect x="340" y="200" width="205" height="52" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="355" y="222" fill="#94a3b8" font-family="monospace" font-size="11">HouseAge (Median Age)</text>
  <text x="355" y="240" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">41.0 Years</text>

  <rect x="115" y="262" width="205" height="52" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="130" y="284" fill="#94a3b8" font-family="monospace" font-size="11">AveRooms (Avg Rooms)</text>
  <text x="130" y="302" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">6.9841</text>

  <rect x="340" y="262" width="205" height="52" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="355" y="284" fill="#94a3b8" font-family="monospace" font-size="11">Population (Block Pop)</text>
  <text x="355" y="302" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">322.0</text>

  <rect x="115" y="324" width="430" height="52" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="130" y="346" fill="#94a3b8" font-family="monospace" font-size="11">Coordinates (Latitude, Longitude)</text>
  <text x="130" y="364" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">37.88° N, -122.23° W (Bay Area)</text>

  <!-- Batch Upload Option -->
  <rect x="115" y="390" width="430" height="110" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="135" y="418" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">📁 Batch CSV Prediction Mode (POST /predict-batch)</text>
  <text x="135" y="442" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Upload test_houses.csv to process hundreds of records simultaneously.</text>
  <text x="135" y="468" fill="#34d399" font-family="monospace" font-size="11">✓ Output: predictions_output.csv (Instant Download)</text>

  <!-- Button -->
  <rect x="115" y="515" width="430" height="42" rx="8" fill="url(#amber-teal)" />
  <text x="330" y="541" text-anchor="middle" fill="#020617" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Predict Housing Price (FastAPI) →</text>

  <!-- Right: ML Model Regression & API Output -->
  <rect x="590" y="125" width="520" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />

  <!-- Predicted Price Result Card -->
  <rect x="615" y="150" width="470" height="115" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="635" y="180" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">PREDICTED HOUSE VALUE (FASTAPI REST API)</text>
  <text x="635" y="222" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="700">$452,600.00</text>
  <text x="635" y="248" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-style="italic">Note: Displayed price is illustrative demo output from the Random Forest Regressor</text>

  <!-- Pipeline Details -->
  <rect x="615" y="280" width="470" height="150" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="635" y="308" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Regression Pipeline Specs</text>
  
  <text x="635" y="336" fill="#38bdf8" font-family="monospace" font-size="12">1. Model: Random Forest Regressor (Scikit-learn)</text>
  <text x="635" y="360" fill="#cbd5e1" font-family="monospace" font-size="12">2. Framework: FastAPI (Uvicorn ASGI)</text>
  <text x="635" y="384" fill="#cbd5e1" font-family="monospace" font-size="12">3. Endpoints: /predict (JSON) &amp; /predict-batch (CSV)</text>
  <text x="635" y="408" fill="#34d399" font-family="monospace" font-size="12">4. Pipeline Scripts: train.py, main.py, explore.py</text>

  <!-- Code Structure Box -->
  <rect x="615" y="445" width="470" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="635" y="472" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600">REPOSITORY REPO TREE</text>
  <text x="635" y="495" fill="#e2e8f0" font-family="monospace" font-size="11">train.py ──► Model training &amp; export</text>
  <text x="635" y="515" fill="#e2e8f0" font-family="monospace" font-size="11">main.py ───► FastAPI application &amp; validation</text>
  <text x="635" y="535" fill="#e2e8f0" font-family="monospace" font-size="11">explore.py ─► Data exploratory analysis</text>
  <text x="635" y="555" fill="#38bdf8" font-family="monospace" font-size="11">test_houses.csv ─► Batch test input dataset</text>
</svg>

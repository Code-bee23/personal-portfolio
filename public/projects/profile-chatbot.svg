<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="chat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bubble-user" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bubble-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#chat-bg)" />

  <!-- Grid overlay -->
  <pattern id="chat-grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35" />
  </pattern>
  <rect width="1200" height="700" fill="url(#chat-grid)" />

  <!-- App Window -->
  <rect x="60" y="50" width="1080" height="600" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <rect x="60" y="50" width="1080" height="50" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <circle cx="95" cy="75" r="6" fill="#ef4444" />
  <circle cx="115" cy="75" r="6" fill="#f59e0b" />
  <circle cx="135" cy="75" r="6" fill="#10b981" />
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">AI Candidate Profile Chatbot — Low-Latency Verified RAG</text>

  <!-- Left Column: Grounded Context & System Spec -->
  <rect x="90" y="125" width="360" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />
  <text x="115" y="160" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Grounded Candidate Context</text>
  <text x="115" y="180" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Pydantic Schemas • Anti-Hallucination Guardrails</text>

  <!-- Pydantic JSON Context card -->
  <rect x="115" y="200" width="310" height="230" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="130" y="225" fill="#38bdf8" font-family="monospace" font-size="12">class CandidateProfile(BaseModel):</text>
  <text x="145" y="248" fill="#94a3b8" font-family="monospace" font-size="11">name: str = "Gauri"</text>
  <text x="145" y="268" fill="#94a3b8" font-family="monospace" font-size="11">role: str = "AI/ML &amp; Full-Stack"</text>
  <text x="145" y="288" fill="#94a3b8" font-family="monospace" font-size="11">ai_skills: list = ["PyTorch", ...]</text>
  <text x="145" y="308" fill="#94a3b8" font-family="monospace" font-size="11">backend: list = ["FastAPI", ...]</text>
  <text x="145" y="328" fill="#94a3b8" font-family="monospace" font-size="11">internships: list = ["Enginow", ...]</text>
  <text x="145" y="348" fill="#94a3b8" font-family="monospace" font-size="11">strict_truthfulness: bool = True</text>
  <text x="130" y="380" fill="#10b981" font-family="monospace" font-size="11">✓ Schema Validated (Zero Hallucination)</text>
  <text x="130" y="405" fill="#a855f7" font-family="monospace" font-size="11">⚡ Groq Llama 3 • 480 tokens/sec</text>

  <!-- Recruiter Preset Prompts -->
  <text x="115" y="460" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Quick Recruiter Prompts</text>
  <rect x="115" y="475" width="310" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="130" y="497" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">"What AI frameworks does Gauri use?"</text>

  <rect x="115" y="517" width="310" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="130" y="539" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">"Describe her experience at Enginow"</text>

  <rect x="115" y="559" width="310" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="130" y="581" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">"What are her core full-stack skills?"</text>

  <!-- Right Column: Interactive Chat Interface -->
  <rect x="475" y="125" width="635" height="495" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1" />

  <!-- Chat message 1 (User) -->
  <rect x="710" y="150" width="380" height="50" rx="12" fill="url(#bubble-user)" />
  <text x="730" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">What practical AI/ML projects has Gauri built?</text>

  <!-- Chat message 1 (Bot response) -->
  <rect x="500" y="215" width="580" height="240" rx="12" fill="url(#bubble-bot)" stroke="#334155" stroke-width="1" />
  <circle cx="530" cy="245" r="14" fill="#6366f1" />
  <text x="530" y="250" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI</text>
  <text x="555" y="250" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Gauri Profile Assistant</text>
  <text x="990" y="250" fill="#64748b" font-family="monospace" font-size="11">120ms latency</text>

  <text x="525" y="285" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13">Gauri has engineered 3 featured end-to-end applications:</text>
  <text x="525" y="315" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">1. AI Symptom Checker:</text>
  <text x="690" y="315" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Scikit-learn Random Forest + FastAPI backend.</text>
  
  <text x="525" y="345" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">2. AI MTO Generator:</text>
  <text x="680" y="345" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">OCR + OpenCV + local LLaVA vision extraction.</text>
  
  <text x="525" y="375" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">3. Profile Chatbot:</text>
  <text x="655" y="375" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Pydantic validation + Groq Llama 3 low-latency chat.</text>

  <text x="525" y="415" fill="#34d399" font-family="monospace" font-size="11">Source: Verified from candidate portfolio repository.</text>

  <!-- Chat message 2 (User) -->
  <rect x="730" y="470" width="360" height="42" rx="12" fill="url(#bubble-user)" />
  <text x="750" y="496" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Is she open to Full-Stack / AI opportunities?</text>

  <!-- Input Field at bottom -->
  <rect x="500" y="555" width="590" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="525" y="585" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">Ask a verified question about Gauri's technical stack...</text>
  <rect x="1010" y="563" width="70" height="32" rx="6" fill="#3b82f6" />
  <text x="1045" y="583" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Send</text>
</svg>
